# hcs-app — the whole stack in one file.
#
#   docker compose up -d
#   open http://localhost:3000
#
# That is the entire setup. The first visit asks for the first admin and the
# company details and writes them to the database; the app generates its own
# encryption key (./storage/.bootstrap/encryption.key) and session secret
# (kept, encrypted, in Mongo). Nothing here has to be edited, and no compose.env
# is needed. Every value below can still be overridden through an optional
# compose.env (see compose.env.example) or shell variables.
#
# What persists on the host, next to this file:
#   ./storage   uploaded documents + the generated encryption key  (BACK THIS UP)
#   ./uploads   legacy upload root
#   ./logs      application logs
#   mongo_data  named volume holding the bundled database            (BACK THIS UP)
#
# Variables (all optional):
#   HCS_APP_PORT       host port to publish the app on            (default 3000)
#   APP_IMAGE/_TAG     image to run                                (ghcr.io/cappytech/hcs-app:ci-latest)
#   APP_PULL_POLICY    "always" (default) or "missing" for a locally built image
#   BUNDLED_MONGO      1 to run the bundled MongoDB, 0 to use an external one
#                      named by MONGO_HOST/MONGO_URI in compose.env (default 1)
#   TS_AUTHKEY         Tailscale auth key; when set the container joins the
#                      tailnet itself (userspace networking, see docker-entrypoint.sh)
#   MAILSIEM_HOST_DIR  host folder of inbound-mail decisions, mounted read-only
#                      (default ./mailsiem; absent, /mail says it is not mounted)
#
# Behind a TLS-terminating proxy (Caddy, nginx, FRP) set TRUST_EDGE_TLS=true in
# compose.env, or once signed in at Admin → Configuration → Security.

services:
  hcs-app:
    image: ${APP_IMAGE:-ghcr.io/cappytech/hcs-app}:${APP_IMAGE_TAG:-ci-latest}
    # "always" follows the moving CI tag; "missing" runs a locally built image.
    pull_policy: ${APP_PULL_POLICY:-always}
    container_name: hcs-app
    restart: unless-stopped
    env_file:
      - path: compose.env
        required: false
    environment:
      FILE_STORAGE_DIR: /app/storage
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-hcs-app}
    ports:
      - "${HCS_APP_PORT:-3000}:5000"
    volumes:
      # FILE_STORAGE_DIR: documents, plus .bootstrap/encryption.key (the at-rest
      # key generated when ENCRYPTION_KEY is unset) and .bootstrap/bootstrap.json
      # (a database connection saved by the wizard). Must outlive the image.
      - ./storage:/app/storage
      - ./uploads:/uploads
      - ./logs:/logs
      # Inbound mail filtering decisions written by the mailsiem collector on
      # the host. Read-only on purpose: the collector owns these files.
      - ${MAILSIEM_HOST_DIR:-./mailsiem}:/app/mailsiem/events:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    depends_on:
      mongodb:
        condition: service_healthy
        required: false

  # Bundled MongoDB. The app probes the hostname "mongodb" when MONGO_HOST is
  # unset, so this needs no configuration. Scale it to 0 (BUNDLED_MONGO=0) to
  # point the app at an external server instead.
  mongodb:
    image: mongo:8
    restart: unless-stopped
    deploy:
      replicas: ${BUNDLED_MONGO:-1}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mongo_data:
