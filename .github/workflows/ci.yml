name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      tailscale:
        description: 'Connect to Tailscale? (required to reach internal services)'
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        if: ${{ inputs.tailscale == true }}
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:dev-ci

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Security audit (prod deps)
        timeout-minutes: 3
        run: npm audit --omit=dev --audit-level=high

      # Runs before the image is built: the box deploys from :latest, so a
      # failing suite must not reach that tag. Previously commented out, with no
      # install step at all, so none of these tests had ever run in CI.
      - name: Test
        timeout-minutes: 10
        run: npm test

      - name: Derive tags
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
          REF_SLUG=$(echo "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g')
          if [ "$GITHUB_REF_NAME" = "main" ] || [ "$GITHUB_REF_NAME" = "master" ] || [ "$GITHUB_REF_NAME" = "Working" ]; then echo "EXTRA_TAG=latest"; else echo "EXTRA_TAG=branch-${REF_SLUG}"; fi >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The builder image comes from Google's Docker Hub mirror: anonymous pulls
      # from Docker Hub were rate-limited or timing out on the shared runners.
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            GIT_COMMIT=${{ env.SHORT_SHA }}
          tags: |
            ${{ env.IMAGE }}:${{ env.EXTRA_TAG }}
            ${{ env.IMAGE }}:sha-${{ env.SHORT_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Published: ${{ env.IMAGE }}:${{ env.EXTRA_TAG }}, sha-${{ env.SHORT_SHA }}" >> $GITHUB_STEP_SUMMARY

  # ------------------------------------------------------------- deploy ---
  # After a master build has passed its tests and pushed :latest, roll the
  # container on server2, as cairn's release.yml does for its edge server.
  # server2 is behind the FRP tunnel, so the runner joins the tailnet and SSHes
  # to it as server2-host. Deploys run in the `production` environment: with
  # no required reviewers it is automatic; add reviewers in Settings →
  # Environments to make each deploy wait for an Approve click.
  #
  # Setup (once): docs/DEPLOYMENT.md.
  deploy:
    name: Deploy to server2
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://app.heroncs.co.uk
    concurrency:
      group: deploy-production
      cancel-in-progress: false   # never interrupt a deploy half way
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || 'server2-host' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '~/docker/app' }}
      DEPLOY_SERVICE: ${{ vars.DEPLOY_SERVICE || 'hcs-app' }}
      APP_URL: ${{ vars.APP_URL || 'https://app.heroncs.co.uk' }}
    steps:
      - name: Derive commit
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:dev-ci

      # tailscale/github-action reports success even when every `tailscale up`
      # attempt failed, so check the runner really is connected.
      - name: Check the runner is on the tailnet
        run: |
          state=$(sudo tailscale status --json 2>/dev/null | jq -r '.BackendState // "unknown"')
          if [ "$state" != "Running" ]; then
            echo "::error::Not connected to Tailscale (state: $state). Tailscale rejected the OAuth client in TS_OAUTH_CLIENT_ID / TS_OAUTH_CLIENT_SECRET; the 'Connect to Tailscale' log shows why. See docs/DEPLOYMENT.md."
            exit 1
          fi

      # The runner's DNS doesn't resolve MagicDNS short names (server2-host), so
      # ask Tailscale for the address from its own peer list instead.
      - name: Find server2 on the tailnet
        run: |
          ip=$(sudo tailscale ip -4 "$DEPLOY_HOST" 2>/dev/null | head -1 || true)
          if [ -z "$ip" ]; then
            echo "::error::$DEPLOY_HOST is not on the tailnet as seen by this runner"
            sudo tailscale status || true
            exit 1
          fi
          echo "Found $DEPLOY_HOST at $ip"
          echo "DEPLOY_IP=$ip" >> $GITHUB_ENV

      # server2 runs Tailscale SSH, which answers port 22 for tailnet connections
      # and authorises them by the tailnet policy (tag:dev-ci → tag:server), not
      # by keys. So this is a plain ssh to its tailnet address with no key.
      - name: Deploy over Tailscale SSH
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER || secrets.DEPLOY_SSH_USER || 'jack' }}
        run: |
          # DEPLOY_PATH goes over unquoted so the remote shell expands a leading ~
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 "$DEPLOY_USER@$DEPLOY_IP" "DEPLOY_PATH=$DEPLOY_PATH DEPLOY_SERVICE=$DEPLOY_SERVICE bash -s" <<'REMOTE'
          set -e
          cd "$DEPLOY_PATH"
          # Fail loudly if this compose doesn't pull from GHCR: a local-only
          # image name makes `pull` a no-op and the deploy would ship nothing.
          if ! docker compose config --images "$DEPLOY_SERVICE" | grep -q '^ghcr.io/'; then
            echo "::error::$DEPLOY_SERVICE in $(pwd) does not use a ghcr.io image"
            exit 1
          fi
          docker compose pull "$DEPLOY_SERVICE"
          # --force-recreate so a new :latest digest always rolls the container
          docker compose up -d --force-recreate "$DEPLOY_SERVICE"
          docker image prune -f
          REMOTE

      # The footer shows the running commit, so wait until it's this one.
      # Catches a deploy that "succeeded" but is still serving the old image.
      - name: Verify the new version is live
        run: |
          for i in $(seq 1 30); do
            live=$(curl -fsS -m 10 "$APP_URL/user/login" | grep -oE 'commit/[0-9a-f]{7,40}' | head -1 || true)
            echo "attempt $i: ${live:-unreachable} (want $SHORT_SHA)"
            case "$live" in *"$SHORT_SHA"*) echo "Live: $SHORT_SHA" >> $GITHUB_STEP_SUMMARY; exit 0;; esac
            sleep 10
          done
          echo "::error::$APP_URL is not serving $SHORT_SHA after 5 minutes"
          exit 1
