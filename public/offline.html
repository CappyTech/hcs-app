<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Heron Constructive Solutions</title>
  <link rel="icon" href="/resources/images/favicon.ico" type="image/x-icon">
  <!--
    Deliberately self-contained: this page is precached by the service worker and shown
    when the network is unreachable, so it cannot depend on the Tailwind bundle, the
    icon font, or anything else being in cache at that moment.
  -->
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f9fafb;
      color: #111827;
    }
    .card {
      width: 100%;
      max-width: 26rem;
      text-align: center;
    }
    img { width: 88px; height: 88px; margin: 0 auto 1.25rem; display: block; }
    h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
    p { font-size: .925rem; line-height: 1.55; color: #4b5563; margin: 0 0 1.5rem; }
    a.retry {
      display: inline-block;
      text-decoration: none;
      font: inherit;
      font-weight: 600;
      color: #fff;
      background: #047857;
      border: 0;
      border-radius: .625rem;
      padding: .7rem 1.5rem;
      cursor: pointer;
    }
    a.retry:hover { background: #065f46; }
    @media (prefers-color-scheme: dark) {
      body { background: #111827; color: #f3f4f6; }
      p { color: #9ca3af; }
    }
  </style>
</head>

<body>
  <div class="card">
    <img src="/resources/images/HCS-Logo-v5-Icon192.png" alt="Heron Constructive Solutions">
    <h1>You're offline</h1>
    <p>
      This page needs a connection. Your work hasn't been lost — reconnect and try again.
    </p>
    <!-- A plain link rather than an onclick handler, so the page needs no inline JS
         and stays safe if a CSP is ever applied to static routes. -->
    <a class="retry" href="/">Try again</a>
  </div>
</body>

</html>
